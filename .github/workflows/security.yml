name: security
on: [push, pull_request]

# LEAST PRIVILEGE: the GITHUB_TOKEN can only read repo contents. Nothing else.
permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # gitleaks scans full history
          persist-credentials: false  # don't leave the token in .git/config for later steps/containers
      - name: Secret scan (Gitleaks) - GATE
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose --exit-code 1

  sast:
    name: sast (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: SAST (Semgrep) - GATE
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d \
            semgrep scan --config auto --error

  dependencies:
    name: dependencies (report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency scan (Trivy) - REPORT
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            fs --scanners vuln --exit-code 0 /repo
